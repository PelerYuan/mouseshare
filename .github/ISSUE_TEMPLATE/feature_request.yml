name: Feature request
description: Suggest an idea or improvement
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [roadmap](https://github.com/PelerYuan/mouseshare/blob/master/docs/ROADMAP.md) and existing issues first.
        mouseshare aims to stay **small, fast and simple** — ideas that fit that goal are the easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on it?
      options: ["Yes, I can send a pull request", "I can help test", "No, just suggesting"]
