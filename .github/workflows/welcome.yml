name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    name: Greet first-time contributors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue in mouseshare! 🎉
            A maintainer will take a look soon. In the meantime, the
            [troubleshooting guide](https://github.com/PelerYuan/mouseshare/blob/master/docs/TROUBLESHOOTING.md)
            may already have the answer. Please never paste your pairing code or `pairing.toml`.
          pr-message: |
            Thanks for your first pull request to mouseshare! 🎉
            CI will run automatically. A maintainer will review it; please see
            [CONTRIBUTING.md](https://github.com/PelerYuan/mouseshare/blob/master/CONTRIBUTING.md)
            for what we look for (tests, docs in English and Chinese, and a CHANGELOG entry).
