[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "mouseshare"
version = "0.1.0"
edition = "2021"

[dependencies]
mouseshare-protocol = { path = "crates/protocol" }
mouseshare-layout = { path = "crates/layout" }
mouseshare-net = { path = "crates/net" }
mouseshare-x11input = { path = "crates/x11input" }
mouseshare-discovery = { path = "crates/discovery" }
# Single-threaded runtime: this app is one connection, polled at a fixed
# tick rate, not a concurrent server -- a thread pool would just be idle
# threads sitting in memory for no benefit.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"

[dev-dependencies]
x11rb = "0.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
