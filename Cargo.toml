[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "mouseshare"
version = "0.1.0"
edition = "2021"

[dependencies]
mouseshare-protocol = { path = "crates/protocol" }
mouseshare-layout = { path = "crates/layout" }
mouseshare-net = { path = "crates/net" }
mouseshare-x11input = { path = "crates/x11input" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
