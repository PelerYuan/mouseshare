[package]
name = "mouseshare-discovery"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "LAN auto-discovery (mDNS/DNS-SD) for mouseshare"
license = "MIT"
repository = "https://github.com/PelerYuan/mouseshare"
publish = false

[dependencies]
mouseshare-protocol = { path = "../protocol" }
mdns-sd = "0.21"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = "0.3"
