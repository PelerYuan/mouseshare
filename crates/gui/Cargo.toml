[package]
name = "mouseshare-gui"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Optional egui/eframe GUI frontend for mouseshare"
license = "MIT"
repository = "https://github.com/PelerYuan/mouseshare"
publish = false

[dependencies]
mouseshare-core = { path = "../core" }
mouseshare-config = { path = "../config" }
mouseshare-protocol = { path = "../protocol" }
mouseshare-layout = { path = "../layout" }
mouseshare-discovery = { path = "../discovery" }
mouseshare-x11input = { path = "../x11input" }
# GUI frameworks are inherently heavier than this project's CLI/daemon core
# -- that's an accepted, deliberate tradeoff for this one opt-in binary, not
# something the rest of the workspace pays for (see the root README).
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui-phosphor = "0.7"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "net"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
