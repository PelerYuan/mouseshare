[package]
name = "mouseshare-net"
version = "0.1.0"
edition = "2021"
description = "TCP transport and framing for mouseshare's wire protocol"
license = "MIT"
repository = "https://github.com/PelerYuan/mouseshare"
publish = false

[dependencies]
mouseshare-protocol = { path = "../protocol" }
tokio = { version = "1", default-features = false, features = ["net", "io-util"] }
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["net", "io-util", "rt", "macros", "time"] }
