[package]
name = "mouseshare-x11input"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "X11 pointer/keyboard capture, injection, and clipboard sync for mouseshare"
license = "MIT"
repository = "https://github.com/PelerYuan/mouseshare"
publish = false

[dependencies]
x11rb = { version = "0.13", features = ["xtest", "randr"] }
thiserror = "1"
tracing = "0.1"
