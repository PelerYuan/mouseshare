# Example arrangement for the command-line tool:
#
#   mouseshare --config layout.toml controller --pair-code laptop=XXXXX-XXXXX
#
# (The GUI keeps the same information in ~/.config/mouseshare/settings.toml;
# you only need this file to run headless with a hand-written layout.)
#
# Coordinates are pixels in one shared "virtual desktop". A device's
# monitors are positioned relative to the device's own origin (x, y), and
# each device moves as one rigid group. Edges must touch exactly for the
# cursor to cross from one device to the next.
#
# `local_id` names the device this file is read on.

local_id = "desk"

# A computer with two side-by-side monitors.
[[devices]]
id = "desk"
x = 0
y = 0

[[devices.monitors]]
name = "DP-1"
x = 0
y = 0
width = 2560
height = 1440

[[devices.monitors]]
name = "DP-2"
x = 2560
y = 0
width = 1920
height = 1080

# A laptop to the right of the desk computer. For a one-monitor device,
# `width` and `height` are a shorthand for a single monitor at (0, 0).
# Here x = 4480 is exactly where the desk's monitors end (2560 + 1920).
[[devices]]
id = "laptop"
x = 4480
y = 0
width = 1920
height = 1080

# The older single-screen form still works and is equivalent to a
# one-monitor device:
#
# [[screens]]
# id = "tablet"
# x = 0
# y = -1080
# width = 1920
# height = 1080
